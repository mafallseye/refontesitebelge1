name: Déploiement Continu belemb.eu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances et Build
        run: |
          npm ci
          npm run build

      - name: Déploiement sécurisé SFTP sur Infomaniak
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: 'pw0lr_sitebelge'
          server: 'pw0lr.ftp.infomaniak.com'
          port: 22
          password: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          local_path: './dist/'
          remote_path: 'web/belemb.eu'
          sftp_only: true
          delete_remote: false