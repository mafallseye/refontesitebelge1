name: Déploiement Continu belemb.eu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 21
          cache: 'npm'

      - name: Installation et Build
        run: |
          npm ci
          npm run build

      - name: Vérification du dossier dist
        run: ls -la dist # Vérifie que le build génère bien le dossier

      - name: Déploiement via SFTP sur Infomaniak
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: pw0lr.ftp.infomaniak.com
          username: pw0lr_sitebelge
          password: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          port: 22
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./