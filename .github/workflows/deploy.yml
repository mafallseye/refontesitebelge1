name: Déploiement Continu belemb.eu

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation et Build
        run: |
          npm ci
          npm run build

      - name: Sauvegarder le dossier build
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: ./dist/
          retention-days: 1 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
       dossier-cible:
          - "./sites/belemb.eu/"
          - "./sites/belemb.eu/mission-economique-conakry/"
          - "./sites/belemb.eu/mission-economique-belge-au-senegal/"
          - "./sites/belemb.eu/mission-to-kenya/"
          - "./sites/belemb.eu/mission-to-gambia/"
          - "./sites/belemb.eu/mission-to-tanzania/"


    steps:
      - name: Récupérer le dossier build
        uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: ./dist/

      - name: Déploiement SFTP sur ${{ matrix.dossier-cible }}
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: pw0lr_sitebelge
          server: pw0lr.ftp.infomaniak.com
          password: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          port: 22 # Port SSH/SFTP obligatoire chez Infomaniak
          local_path: ./dist/
          remote_path: ${{ matrix.dossier-cible }}
