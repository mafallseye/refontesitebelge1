name: Déploiement Continu belemb.eu

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4.2.0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation et Build
        run: |
          npm ci
          npm run build

      - name: Sauvegarder le dossier build
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: ./dist/
          # Optionnel : Réduit la rétention à 1 jour pour libérer l'espace
          retention-days: 1 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # FORCE les déploiements à se faire l'un après l'autre au lieu de saturer le réseau
      max-parallel: 1
      matrix:
        dossier-cible:
          - "./sites/belemb.eu/"
          - "./sites/belemb.eu/mission-economique-conakry/"
          - "./sites/belemb.eu/mission-economique-conakry/"
          - "./sites/belemb.eu/mission-economique-belge-au-senegal/"
          - "./sites/belemb.eu/mission-to-gambia/"
          # Ajoutez vos autres sous-dossiers ici

    steps:
      - name: Récupérer le dossier build
        uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: ./dist/

      - name: Déploiement SFTP sur ${{ matrix.dossier-cible }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ://infomaniak.com
          username: pw0lr_sitebelge
          password: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ matrix.dossier-cible }}
